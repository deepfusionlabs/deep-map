# DeepMap benchmark: hard-question set + schema
# Status: no benchmark result is published yet. Results live in benchmark/results/, NOT here.
#   The method these questions serve is described in benchmark/README.md (§1-§5).
#
# ─────────────────────────────────────────────────────────────────────────────
# READ THIS FIRST: the honesty contract this file is built to satisfy:
#
# 1. LEAD METRIC = COMPLETENESS / CORRECTNESS on hard questions, NOT tokens saved.
#    Tokens / tool-calls / wall-clock / cost ARE captured and reported by the harness
#    but are NEVER led with. A question earns its place here because grep returns a
#    string match but NOT the answer: the agent must reconstruct a graph.
#
# 2. THE SINGLE-HOP CONTROLS ARE NOT FILLER AND MUST NOT BE HIDDEN. They exist to surface
#    DeepMap's LOSSES. On a "where is function X defined" lookup a grep-capable agent is
#    faster, cheaper, and equally complete — DeepMap should NOT win it, and the harness
#    must publish that ("publishes its own losses").
#    Every control question carries grep_can_do: true and is counted as a LOSS for the
#    ON arm if ON does not at least tie ON COMPLETENESS AND AT LOWER-OR-EQUAL COST/SPEED.
#    Removing or down-weighting these defeats the thesis.
#
# 3. FAIR BASELINE. The no-DeepMap arm (Arm B / OFF) runs with `--strict-mcp-config` and
#    NO `--mcp-config` — which, per the live `claude` CLI ("Only use MCP servers from
#    --mcp-config, ignoring all other MCP configurations"), means ZERO MCP servers (no
#    DeepMap server, no Neo4j tool). Built-in Read/Grep/Bash are available to BOTH arms.
#    A DeepMap "win" must be a win over a real grep-capable
#    agent, never a strawman. grep_partial_answer below states, up front, the honest best
#    the OFF arm can reasonably get — so a question grep can actually answer is exposed,
#    not dressed up.
#
# 4. NO MEASURED NUMBER MAY APPEAR ANYWHERE until a blind-scored run on Opus 4.8 exists.
#    The answer_keys below are REAL ground-truth, authored against the exact pinned SHAs,
#    ADVERSARIALLY VERIFIED (an independent agent confirmed every file:line atom against the source),
#    and independently re-verified on 2026-07-08 (all 334 atoms; see benchmark/CURATION_PROVENANCE.md).
#    They are the completeness oracle (ground_truth_set), NOT measured results: the head-to-head
#    numbers exist only after a blind-scored run. Results files stay TEMPLATES with empty cells,
#    never fabricated values.
#
# 5. ROLE SEPARATION: curator (picks repos + writes these questions + answer keys)
#    != scorer != harness author. The held-out scoring rationale is kept out of this file and out
#    of the published results. This file (question text + ground-truth keys) is published.
# ─────────────────────────────────────────────────────────────────────────────


# =============================================================================
# SCHEMA — every entry under `questions:` MUST conform to this.
# =============================================================================
schema:
  id: |
    string, globally unique, stable. Convention: "<repo_slug>-<family_abbrev>-<n>"
    (e.g. "caddy-runtime-1", "click-ctrl-1"). The harness keys results by this id; never reuse.
  repo: |
    string "owner/name" — MUST match an entry in benchmark/repos.yaml (which carries the
    pinned_sha + license + stack). Clone is for MEASUREMENT ONLY; repo source is never
    redistributed. A question is only runnable once its repo is pinned in repos.yaml.
  prompt: |
    string — the verbatim question text handed to BOTH arms (identical prompt; the arms differ
    ONLY by MCP-config). Phrase it so a COMPLETE answer requires enumerating the full
    transitive/structural set; an incomplete answer (what grep yields) is the measurable gap
    (the framing discipline). Use {placeholders} in templates; instantiate per pinned repo.
  family: |
    enum — exactly one of:
      multi_hop          : blast-radius / reverse-reachability ("what breaks if I change X,
                           including reflective/runtime callers?"). Grep finds the symbol,
                           not the transitive dependent set.
      transitive         : forward transitive reachability / dependency chain ("full chain from
                           entry point to storage"). Grep finds an endpoint, not the chain.
                           (cycle/coupling questions fold in here.)
      runtime_edge       : edges that exist only at runtime — framework routes, registry
                           registration, dynamic require/import, DI wiring — with NO static
                           import grep can follow.
      concept_to_impl    : prose capability -> implementation ("where is PCI/payment validation
                           actually enforced?"). Grep on the prose words fails; DeepMap's
                           INTENT-SUMMARY embeddings find it. MUST use reframed wording
                           ("what the code DOES, not how it's spelled") — never "code-trained/
                           code-aware".
      single_hop_control : a deliberately easy lookup grep should win or tie ("where is X
                           defined", literal-string search). EXISTS TO SURFACE LOSSES (above).
    EXACTLY ONE family per question (no combined tags). A question whose prompt mixes axes
    (e.g. registry-resolved reachability) is tagged by its DOMINANT axis — see caddy-runtime-1.
    Mapping to the per-repo family ids (for the per-repo questions/<repo>.json files):
      transitive        <- transitive_reachability
      multi_hop         <- multi_hop_dependency / blast_radius (+ cycle_coupling)
      runtime_edge      <- runtime_edge
      concept_to_impl   <- concept_to_implementation
      single_hop_control<- (new here; the publish-losses control class)
  grep_can_do: |
    bool. TRUE only for single_hop_control questions where a grep-capable agent should win or
    tie. The hard families (multi_hop / transitive / runtime_edge / concept_to_impl) are ALWAYS false
    — they are the class grep fundamentally cannot do. The harness scores any single_hop_control
    that ON does not at least tie ON COMPLETENESS AND AT LOWER-OR-EQUAL COST/SPEED as a LOSS, and
    routes grep_can_do:true families into the `where_grep_wins` section of benchmark/README.md
    NEVER set true to hide a loss on a hard family, and never set false on a control to
    manufacture a win.
  answer_key: |
    object — the known-answer description / acceptance check (the oracle: a real-world
    known-issue oracle). Fields:
      ground_truth_answer : prose statement of the correct, complete answer.
      ground_truth_set    : the enumerable set (nodes / edges / components / file:line) that
                            CONSTITUTES completeness. completeness_pct = fraction of this set the
                            answer correctly enumerates (the hero metric). REQUIRED and
                            non-empty before the blind scorer can compute completeness_pct; the
                            harness selftest soft-flags an empty ground_truth_set.
      oracle_provenance   : how the key was derived + verified, e.g.
                            "Graphify graph at SHA <pin> + manual file:line verification".
                            For single_hop_control questions the provenance is DELIBERATELY
                            "grep/ctags at SHA <pin>" (NOT Graphify) — grep IS the honest oracle
                            for a grep-answerable question; this is intentional, not an error.
      grep_partial_answer : the honest best the OFF/grep arm can reasonably get (the honesty hook).
                            For controls this is the full answer; for the hard families it
                            is the incomplete fragment that exposes the gap.
      acceptance          : the PASS/FAIL boundary for THIS question (the benchmark boundary).
                            A claim is FAIL if code-refuted at
                            the pinned SHA; a HIGH-confidence code-refuted claim is `wrong_high`
                            (the cardinal sin).
    NOTE: the answer_keys below are REAL ground-truth, authored against the pinned SHAs and
    adversarially verified (every file:line atom confirmed against source), then independently
    re-verified (2026-07-08; see benchmark/CURATION_PROVENANCE.md). The ground_truth_set (completeness
    oracle) is real; the head-to-head numbers are NOT measured until a blind-scored run. The
    `templates:` block above keeps its {placeholder} form by design.
  notes: |
    string — free-form: which structural property defeats grep here, which DeepMap retrieval arm
    is expected to ground it (vector / bm25 / graph_weighted — the winning_arm_attribution
    signal), and any honest caveat ("on a flat-import repo grep may reconstruct this
    too -> route to where_grep_wins"). Caveats here feed the per-repo `honest_caveat`.

# emit_mapping — the EXACT transform the curator applies to split this consolidated
# schema-of-record into the per-repo `benchmark/questions/<repo>.json` files.
# This is NOT 1:1 by field name — both a value rename (family) AND a structural change
# (rename `prompt`, un-nest `answer_key.*` to flat keys) are required. Spelled out so the
# emit is mechanical and lossless:
emit_mapping:
  target_path: "benchmark/questions/<repo>.json"          # the per-repo home
  field_renames:                                           # this YAML key -> per-repo JSON key
    prompt: question_text                                  # the per-repo JSON names it question_text
  flatten:                                                 # un-nest answer_key.* to top-level
    answer_key.ground_truth_answer: ground_truth_answer
    answer_key.ground_truth_set: ground_truth_set
    answer_key.oracle_provenance: oracle_provenance
    answer_key.grep_partial_answer: grep_partial_answer
    answer_key.acceptance: acceptance
  family_value_renames:                                    # this YAML enum -> the per-repo family id
    transitive: transitive_reachability
    multi_hop: multi_hop_dependency
    runtime_edge: runtime_edge
    concept_to_impl: concept_to_implementation
    single_hop_control: single_hop_control
  carried_through: [id, repo, family, grep_can_do, notes]  # passed verbatim (family value via rename above)


# =============================================================================
# STARTER SET — TEMPLATES (the class grep fundamentally cannot do)
# Repo-parameterizable. {placeholders} are instantiated per pinned repo by the curator.
# These four templates + the control template are the reusable spine; the concrete
# instantiations follow under `questions:`.
# =============================================================================
templates:

  - id: TEMPLATE-multi_hop-blast_radius
    repo: "{owner/name}"
    prompt: >-
      If I change the return type (or signature) of {symbol} in {file}, what breaks?
      Enumerate EVERY component that transitively depends on it — direct callers, callers
      N hops away, AND any reflective / runtime / framework-mediated callers that never
      statically import it. For each, name the file:line and the edge that connects it.
    family: multi_hop
    grep_can_do: false
    answer_key:
      ground_truth_answer: "The full reverse-reachable set of {symbol}, static + runtime."
      ground_truth_set: ["<every transitively-dependent node + the connecting edge, file:line>"]
      oracle_provenance: "Graphify reverse-reachability at SHA <pin> + manual verification"
      grep_partial_answer: "grep on {symbol} finds direct textual call sites only; misses N-hop and reflective callers."
      acceptance: "completeness_pct over ground_truth_set; any code-refuted HIGH claim = wrong_high (FAIL)."
    notes: >-
      DeepMap's _arm_graph_weighted centrality story (build/retrieval.py). Grep cannot
      do reverse reachability or see reflective callers. Expected grounding: graph_weighted + bm25.

  - id: TEMPLATE-transitive-entry_to_storage
    repo: "{owner/name}"
    prompt: >-
      Starting from the HTTP/CLI entry point for {route_or_command}, list the FULL ordered chain
      of components a request passes through before it reaches the storage/persistence layer.
      Include every intermediate handler, middleware, and service hop, with file:line for each.
    family: transitive
    grep_can_do: false
    answer_key:
      ground_truth_answer: "The complete ordered call/dispatch chain from entry to storage."
      ground_truth_set: ["<each hop in order: component + file:line + edge type>"]
      oracle_provenance: "Graphify forward-reachability at SHA <pin> + manual verification"
      grep_partial_answer: "grep finds the entry handler and maybe the storage call; not the ordered chain between them."
      acceptance: "completeness_pct = fraction of the ordered chain enumerated; wrong order or invented hops = FAIL."
    notes: >-
      Registry/dispatch indirection (e.g. caddy RegisterModule) defeats grep entirely.
      Cycle/coupling variants also map to `transitive`. Expected grounding: graph_weighted.

  - id: TEMPLATE-runtime_edge-wired_at_runtime
    repo: "{owner/name}"
    prompt: >-
      Which components are wired together ONLY at runtime — via framework route registration,
      registry/plugin registration, dynamic require/import, or dependency injection — with NO
      static import between them? List each producer->consumer pair and the mechanism that links them.
    family: runtime_edge
    grep_can_do: false
    answer_key:
      ground_truth_answer: "The set of runtime-only edges (route/registry/dynamic-import/DI) and their mechanisms."
      ground_truth_set: ["<each runtime edge: producer, consumer, mechanism, file:line of the wiring>"]
      oracle_provenance: "Graphify INFERRED/runtime edges at SHA <pin> + manual verification"
      grep_partial_answer: "grep finds the registration call sites as strings but cannot connect producer to consumer (no static import exists)."
      acceptance: "completeness_pct over the runtime-edge set; a fabricated static import claimed as the link = FAIL (wrong_high)."
    notes: >-
      The exact edges grep STRUCTURALLY cannot see. DeepMap's framework-edge
      + confidence/INFERRED story. Expected grounding: graph_weighted (INFERRED edges).

  - id: TEMPLATE-concept_to_impl-where_enforced
    repo: "{owner/name}"
    prompt: >-
      Where is "{capability_in_prose}" actually implemented and enforced in this codebase?
      (e.g. payload/payment validation before persistence, authn/authz enforcement, rate limiting).
      Point to the function(s) that do the real work and the call site(s) where the enforcement happens.
    family: concept_to_impl
    grep_can_do: false
    answer_key:
      ground_truth_answer: "The function(s) implementing the capability + the enforcement call site(s)."
      ground_truth_set: ["<implementing function file:line>", "<enforcement call site file:line>"]
      oracle_provenance: "Graphify intent-summary match at SHA <pin> + manual verification"
      grep_partial_answer: "grep on the prose words ('PCI', 'validation') finds comments/strings or nothing — the code is spelled differently."
      acceptance: "completeness_pct = found both implementation and enforcement site; matching only a comment/string = FAIL."
    notes: >-
      Substantiates the intent-search wedge via DeepMap's INTENT-SUMMARY embeddings (embeds
      body_summary/docstring, not raw code; reframed wording only — never "code-trained").
      Expected grounding: vector. This is the family where the embedding arm earns its keep.

  - id: TEMPLATE-single_hop_control-definition
    repo: "{owner/name}"
    prompt: >-
      Where is {symbol} defined? Give the file and line.
    family: single_hop_control
    grep_can_do: true
    answer_key:
      ground_truth_answer: "The single definition site of {symbol}."
      ground_truth_set: ["<file:line of the definition>"]
      oracle_provenance: "grep/ctags at SHA <pin> (DELIBERATELY grep, not Graphify — grep is the honest oracle here)"
      grep_partial_answer: "grep answers this fully, fast, and cheap — this is grep's home turf."
      acceptance: "Exact file:line. ON arm must at least TIE on completeness; if ON is slower/costlier at equal completeness it is a LOSS and is published in where_grep_wins."
    notes: >-
      CONTROL — exists to surface losses, not to be hidden. Single-hop lookup; DeepMap should NOT
      win. Counted as a LOSS for ON unless it ties on completeness at lower-or-equal cost/speed.
      See header note 2. Mirror this with a literal-string-search control where useful
      (e.g. "find every occurrence of the string '...'").


# =============================================================================
# QUESTIONS — 33 concrete questions against 5 Python OSS repos at real pinned SHAs (repos.yaml).
# Authored + ADVERSARIALLY VERIFIED 2026-06-30 by curator workflows (analyze -> author -> independent
# verify: every file:line atom confirmed against the source), THEN a 3-lens set-level QA review + fix pass
# (added reverse-reachability coverage; reframed grep-baselines to the honest agentic floor). Families:
# multi_hop (4), transitive (7), runtime_edge (7), concept_to_impl (10), single_hop_control (5). The
# answer_keys are REAL ground-truth (independently re-verified 2026-07-08; see benchmark/CURATION_PROVENANCE.md);
# NO head-to-head number is measured until a blind-scored run. This block is the Python set; the
# multi-language breadth wing follows below.
# =============================================================================
questions:

  - id: requests-transport-1
    repo: psf/requests
    prompt: |-
      When I call requests.get('https://example.com'), the code eventually does adapter.send(request) in Session.send. How is the concrete object behind that `adapter` variable chosen at runtime, and trace the path from that .send() call down to the actual urllib3 call that opens the network connection.
    family: transitive
    grep_can_do: false
    answer_key:
      ground_truth_answer: |-
        The `adapter` in Session.send (sessions.py:784, `r = adapter.send(request, **kwargs)`) is resolved one line earlier by `adapter = self.get_adapter(url=request.url)` (sessions.py:778). get_adapter (sessions.py:870) iterates self.adapters (an OrderedDict) and returns the first adapter whose registered prefix matches the URL via `url.lower().startswith(prefix.lower())` (sessions.py:877). That adapters dict is populated by Session.mount, called in Session.__init__ as `self.mount('https://', HTTPAdapter())` / `self.mount('http://', HTTPAdapter())` (sessions.py:502-503), so for an https URL the concrete object is an HTTPAdapter. BaseAdapter.send (adapters.py:128) is abstract (`raise NotImplementedError`, adapters.py:151); the body that actually runs is HTTPAdapter.send (adapters.py:634). It calls self.get_connection_with_tls_context(request, ...) (adapters.py:662) which calls `self.poolmanager.connection_from_host(**host_params, pool_kwargs=pool_kwargs)` (adapters.py:506) to get a urllib3 connection pool from the PoolManager (created in init_poolmanager, adapters.py:262). HTTPAdapter.send then performs the network I/O with `resp = conn.urlopen(...)` (adapters.py:696). So the dispatch is data-driven: prefix-match over a dict populated by mount selects HTTPAdapter, whose send reaches urllib3's PoolManager.connection_from_host and HTTPConnectionPool.urlopen.
      ground_truth_set:
        - "src/requests/sessions.py:784 — Session.send (adapter.send call: r = adapter.send(request, **kwargs))"
        - "src/requests/sessions.py:778 — Session.send (get_adapter call: adapter = self.get_adapter(url=request.url))"
        - "src/requests/sessions.py:877 — Session.get_adapter (prefix match: url.lower().startswith(prefix.lower()))"
        - "src/requests/sessions.py:502 — Session.__init__ (self.mount('https://', HTTPAdapter()))"
        - "src/requests/adapters.py:151 — BaseAdapter.send (raise NotImplementedError)"
        - "src/requests/adapters.py:634 — HTTPAdapter.send (def send)"
        - "src/requests/adapters.py:506 — HTTPAdapter.get_connection_with_tls_context (self.poolmanager.connection_from_host)"
        - "src/requests/adapters.py:696 — HTTPAdapter.send (resp = conn.urlopen)"
        - "src/requests/adapters.py:262 — HTTPAdapter.init_poolmanager (self.poolmanager = PoolManager)"
      oracle_provenance: |-
        manual file:line verification at psf/requests@23953c0c8752 by an independent adversarial-verifier agent (independently re-verified 2026-07-08; see CURATION_PROVENANCE.md)
      grep_partial_answer: |-
        Grep for 'adapter.send' finds sessions.py:784, and grep for 'def send' finds both BaseAdapter.send (adapters.py:128) and HTTPAdapter.send (adapters.py:634). But the receiver is a BaseAdapter-typed variable; BaseAdapter.send just raises NotImplementedError. Nothing textually links the call site to HTTPAdapter or to urllib3's PoolManager/urlopen. A grep agent cannot prove which send body runs (it is decided by get_adapter's runtime prefix-match over a dict filled by mount) nor that 'send' reaches urllib3 — 'PoolManager' never co-occurs with 'send' in any single region.
      acceptance: |-
        completeness_pct over ground_truth_set; any code-refuted HIGH claim = wrong_high (FAIL).
    notes: |-
      VERIFIED (grep_cannot_reconstruct=True). All 9 atoms verified at the exact line numbers claimed; nothing drifted. The answer's runtime-dispatch reasoning is fully correct: Session.send (sessions.py:784) calls adapter.send on the object returned by get_adapter (sessions.py:778); get_adapter (sessions.py:870) iterates self.adapters (an Order

  - id: requests-redirect-auth-2
    repo: psf/requests
    prompt: |-
      If I do requests.get(url, auth=('user','pass')) and the server 302-redirects to a different host, does requests resend my Authorization header to the new host, and where exactly is that decided? Also, on the same 302, what happens to the HTTP method of a POST?
    family: transitive
    grep_can_do: false
    answer_key:
      ground_truth_answer: |-
        The Authorization header is dropped when the redirect crosses to a different host (and in other scheme/port-change cases). The path: Session.send drives redirects via `gen = self.resolve_redirects(r, request, **kwargs)` and `history = [resp for resp in gen]` (sessions.py:804-805) — resolve_redirects is a generator, so it only runs as the list comprehension iterates it. Inside the per-hop while loop (sessions.py:204), each hop calls self.rebuild_auth(prepared_request, resp) (sessions.py:273). rebuild_auth (sessions.py:309) checks `if 'Authorization' in headers and self.should_strip_auth(original_url, url): del headers['Authorization']` (sessions.py:324-327). should_strip_auth (sessions.py:154) returns True when `old_parsed.hostname != new_parsed.hostname` (sessions.py:158), so a cross-host 302 strips the header (it also re-applies netrc auth for the new host via get_netrc_auth at sessions.py:330-332). For the method: rebuild_method is called at sessions.py:247; rebuild_method (sessions.py:370) turns a 302 into a GET via `if response.status_code == codes.found and method != 'HEAD': method = 'GET'` (sessions.py:384-385) — codes.found is 302 through the status_codes indirection. Ordering: rebuild_method runs first, then proxies are rebuilt (sessions.py:272), then rebuild_auth (sessions.py:273); each hop re-enters the pipeline via the recursive self.send at sessions.py:292.
      ground_truth_set:
        - "src/requests/sessions.py:805 — Session.send (drain resolve_redirects generator: history = [resp for resp in gen])"
        - "src/requests/sessions.py:204 — SessionRedirectMixin.resolve_redirects (while url loop)"
        - "src/requests/sessions.py:273 — resolve_redirects (rebuild_auth call: self.rebuild_auth(prepared_request, resp))"
        - "src/requests/sessions.py:327 — SessionRedirectMixin.rebuild_auth (del headers['Authorization'])"
        - "src/requests/sessions.py:158 — SessionRedirectMixin.should_strip_auth (hostname compare returns True)"
        - "src/requests/sessions.py:247 — resolve_redirects (rebuild_method call: self.rebuild_method(prepared_request, resp))"
        - "src/requests/sessions.py:384 — SessionRedirectMixin.rebuild_method (302 codes.found -> GET)"
        - "src/requests/sessions.py:292 — resolve_redirects (recursive self.send per hop)"
        - "src/requests/status_codes.py:43 — 302: ('found',) mapping for codes.found"
      oracle_provenance: |-
        manual file:line verification at psf/requests@23953c0c8752 by an independent adversarial-verifier agent (independently re-verified 2026-07-08; see CURATION_PROVENANCE.md)
      grep_partial_answer: |-
        Grep for 'Authorization' shows the `del headers['Authorization']` in rebuild_auth (sessions.py:327) and the set in auth.py, and grep for 'should_strip_auth' finds its definition. But grep cannot show that rebuild_auth is reachable from an ordinary .get() — the call chain is send → (lazy) resolve_redirects generator → rebuild_auth → should_strip_auth, firing once per hop only when the comprehension iterates the generator. The POST→GET downgrade is keyed on codes.found (a status_codes indirection), invisible to a grep for 'GET' or '302', and grep cannot establish the per-hop reachability or the rebuild_method→rebuild_proxies→rebuild_auth ordering.
      acceptance: |-
        completeness_pct over ground_truth_set; any code-refuted HIGH claim = wrong_high (FAIL).
    notes: |-
      VERIFIED (grep_cannot_reconstruct=True). All 8 candidate atoms verified at the exact cited line numbers in the real code (psf/requests @ 23953c0c). Answer is fully correct:
      
      1. Auth-drop decision: rebuild_auth (sessions.py:309) checks `if 'Authorization' in headers and self.should_strip_auth(original_url, url): del headers['Authorization']

  - id: requests-digest-hooks-3
    repo: psf/requests
    prompt: |-
      With auth=HTTPDigestAuth('u','p'), how does requests transparently handle the server's initial 401 challenge and resend the request? handle_401 is never called by name anywhere — what actually invokes it?
    family: transitive
    grep_can_do: false
    answer_key:
      ground_truth_answer: |-
        It works through the response-hook registry, not a direct call. When the request is prepared, PreparedRequest.prepare calls prepare_auth (models.py:445), which runs the auth callable — HTTPDigestAuth.__call__ (auth.py:321) — and that registers the handlers onto the request's 'response' hook list: `r.register_hook('response', self.handle_401)` (auth.py:339) and `r.register_hook('response', self.handle_redirect)` (auth.py:340). register_hook (models.py:257) appends them into self.hooks['response']. Later, Session.send reads `hooks = request.hooks` (sessions.py:775) and calls `r = dispatch_hook('response', hooks, r, **kwargs)` (sessions.py:791). dispatch_hook (hooks.py:32) iterates the hook list and calls each one as `_hook_data = hook(hook_data, **kwargs)` (hooks.py:45), and replaces the response with the hook's return value if non-None (hooks.py:46-47). That call is what runs handle_401 (auth.py:273). On a 401 with a digest challenge, handle_401 builds the digest header and resends via `_r = r.connection.send(prep, **kwargs)` (auth.py:312) — a second adapter round-trip whose result replaces the original response. So supplying HTTPDigestAuth causes a transparent second request, invoked entirely through the hook list value, never by a named call to handle_401.
      ground_truth_set:
        - "src/requests/auth.py:339 — HTTPDigestAuth.__call__ (register_hook handle_401)"
        - "src/requests/auth.py:273 — HTTPDigestAuth.handle_401"
        - "src/requests/auth.py:312 — HTTPDigestAuth.handle_401 (resend via connection.send)"
        - "src/requests/models.py:445 — PreparedRequest.prepare (prepare_auth call)"
        - "src/requests/models.py:266 — RequestHooksMixin.register_hook (append to hooks list)"
        - "src/requests/sessions.py:775 — Session.send (hooks = request.hooks)"
        - "src/requests/sessions.py:791 — Session.send (dispatch_hook call)"
        - "src/requests/hooks.py:45 — dispatch_hook (hook(hook_data) invocation)"
      oracle_provenance: |-
