  - id: zod-concept-1
    repo: colinhacks/zod
    prompt: |-
      In Zod v4's core engine, when you call `.parse(value)` on a schema (e.g. `z.string().parse(123)`),
      how does the library validate the value, collect validation issues, and turn a failure into a thrown
      error? Describe the mechanism end to end and name the concrete functions involved: the public parse
      entry, how the input payload and its `issues` array are created and threaded through, where a
      type-specific check records an issue, how refinement checks are applied, and how the collected raw
      issues are finalized and wrapped into the thrown error. Answer for the v4 subtree (packages/zod/src/v4).
    family: concept_to_impl
    grep_can_do: false
    answer_key:
      ground_truth_answer: |-
        `parse` is produced by the `_parse` factory bound to `$ZodRealError` (parse.ts:30). `_parse`
        (parse.ts:16) builds a sync `ParseContextInternal`, seeds a payload `{ value, issues: [] }`, and calls
        `schema._zod.run(payload, ctx)` (parse.ts:18). The `$ZodType` constructor wires `inst._zod.run`
        (schemas.ts:278): on the forward path it invokes the type-specific `inst._zod.parse` (schemas.ts:297)
        and then applies refinement checks via `runChecks` (schemas.ts:218), all appending to the SAME
        `payload.issues` array. For a string, `$ZodString`'s parse (schemas.ts:360) checks `typeof value` and,
        on mismatch, pushes an `invalid_type` raw issue (schemas.ts:368). Back in `_parse`, if
        `result.issues.length` is truthy it constructs and throws the error, mapping each raw issue through
        `util.finalizeIssue` (parse.ts:23), which resolves the human message (util.ts:849).
      ground_truth_set:
        - "packages/zod/src/v4/core/parse.ts:30 — parse (public entry = _parse(errors.$ZodRealError))"
        - "packages/zod/src/v4/core/parse.ts:16 — _parse (factory: builds ctx, seeds { value, issues: [] } payload)"
