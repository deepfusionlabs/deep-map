  - id: httprouter-concept-1
    repo: julienschmidt/httprouter
    prompt: |-
      At request time, how does httprouter match a registered route pattern that contains a
      named parameter (`:name`) or a catch-all (`*name`) against the incoming URL path, and how
      does it capture the parameter values? Name the function(s) that do the matching and the
      key statements where a `:name` value versus a `*name` value is extracted.
    family: concept_to_impl
    grep_can_do: false
    answer_key:
      ground_truth_answer: |-
        Matching happens inside `node.getValue` (tree.go:326), which `Router.ServeHTTP` invokes
        per request at router.go:471. As it walks the trie, a node without a wildcard child takes
        the static fast-path (index lookup at tree.go:337); when the current node has a wildcard
        child it descends into it and switches on the child's node type (tree.go:354). For a
        `param` node it scans to the next '/' or the path end to delimit the segment (tree.go:358)
        and stores `Param{Key: n.path[1:], Value: path[:end]}` (tree.go:371). For a `catchAll`
        node it stores the remainder of the path as `Param{Key: n.path[2:], Value: path}`
        (tree.go:401, tree.go:411). The registered handle at the matched leaf is returned at
        tree.go:390 (param path) / tree.go:416 (catch-all path).
      ground_truth_set:
        - "router.go:471 — Router.ServeHTTP calls root.getValue(path, r.getParams) at request time"
        - "tree.go:326 — node.getValue (walks the trie to match the request path to a handle)"
        - "tree.go:337 — static-child fast path (index-char lookup, no wildcard)"
        - "tree.go:354 — descend into wildcard child, switch on node type, param branch"
        - "tree.go:358 — scans for the param segment end (next '/' or path end)"
        - "tree.go:371 — saves the :name value as Param{Key: n.path[1:], Value: path[:end]}"
        - "tree.go:401 — catchAll case matches a *catch-all segment"
        - "tree.go:411 — saves the *name value as Param{Key: n.path[2:], Value: path} (the rest of the path)"
        - "tree.go:390 — returns the matched n.handle for the param path (tree.go:416 for catch-all)"
