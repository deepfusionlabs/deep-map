  - id: gin-concept-1
    repo: gin-gonic/gin
    prompt: |-
      In gin, when a route matches, a slice of handlers (middleware + the final handler)
      runs in order, and any middleware may short-circuit the rest. Explain the exact
      mechanism gin uses to execute that handler chain in order and to stop it early:
      which method drives iteration, what internal cursor tracks the position, how the
      chain slice is assembled, and how an abort halts the remaining handlers. Cite the
      concrete symbols and file:line.
    family: concept_to_impl
    grep_can_do: false
    answer_key:
      ground_truth_answer: |-
        The chain is driven by Context.Next (context.go:198): it pre-increments the int8
        cursor c.index and loops while index < len(handlers), invoking c.handlers[c.index](c)
        (context.go:202) for each entry in slice order, so a middleware that itself calls
        c.Next() runs the rest re-entrantly. The cursor is the Context.index field
        (context.go:68). The ordered slice is built by RouterGroup.combineHandlers
        (routergroup.go:241), which copies the group's middleware first, then the route
        handlers. Abort works by setting c.index = abortIndex (context.go:217), where
        abortIndex = math.MaxInt8>>1 (context.go:57); that makes Next's loop condition fail so
        no further handlers run (IsAborted, context.go:209, reports it). The chain is first
        kicked off from handleHTTPRequest via c.Next() (gin.go:722) after a route matches.
      ground_truth_set:
        - "context.go:198 — Context.Next (executor: pre-increments c.index, loops over the chain)"
        - "context.go:202 — c.handlers[c.index](c) (invokes each handler in slice order)"
        - "context.go:68 — Context.index int8 field (the cursor into the HandlersChain)"
        - "context.go:57 — abortIndex const = math.MaxInt8 >> 1 (the stop sentinel)"
        - "context.go:217 — Context.Abort (sets c.index = abortIndex, halting remaining handlers)"
        - "routergroup.go:241 — RouterGroup.combineHandlers (assembles ordered chain: group middleware then route handlers)"
        - "gin.go:722 — Engine.handleHTTPRequest calls c.Next() to start the matched chain"
      oracle_provenance: |-
        manual file:line verification at gin-gonic/gin@34dac209ffb6 by curator agent (independently re-verified 2026-07-08; see CURATION_PROVENANCE.md)
      grep_partial_answer: |-
        Grep for "func (c *Context) Next" lands on context.go:198 directly, so the entry point
        is findable. But the mechanism — that the int8 c.index cursor plus the abortIndex
        sentinel (a bit-shifted MaxInt8) is what makes Abort stop the loop, and that
        combineHandlers is where slice order is established — requires reading and connecting
        four separate symbols across two files; grep alone cannot reconstruct the ordering/abort
        semantics.
      acceptance: |-
        completeness_pct over ground_truth_set; any code-refuted HIGH claim = wrong_high (FAIL).
    notes: |-
      All 7 lines read and confirmed in context.go / routergroup.go / gin.go at the pinned SHA.

