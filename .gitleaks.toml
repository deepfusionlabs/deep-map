# gitleaks config, used by the gitleaks CI job (.github/workflows/gitleaks.yml) and by local scans.
# It extends the DEFAULT ruleset, so all normal secret detection still runs. It allowlists only:
#   - the local, gitignored secret files (`.env`, `.env.local`, `.env.*`, `secrets.local.*`). They are never
#     committed, but a working-tree scan (`gitleaks detect --no-git`) does not honour .gitignore. This skip is by
#     path alone, so the CI job's "No local secret file in the history" step fails on any commit that holds such a
#     path (keep its pattern equal to the paths in block 1);
#   - the synthetic test values that the default `generic-api-key` rule reads as keys:
#     - DeepMap project keys (`project_key=` / `KEY =`), which are sha1/sha256 hex prefixes of a path
#       (build/port_registry.py `_key_of`, and the 16-hex root id of `setup_python_path`), 12 or 16 lowercase
#       hex, sometimes with a one-letter prefix;
#     - two 40-hex constants in two named gates (a synthetic key and public git commit pins of benchmark corpora);
#     - one graphify node id ("pkg2_matcher") in one captured fixture.
# Every test rule below is limited to the generic-api-key rule AND a path AND the exact value shape, so a real
# credential (any other rule, or any other shape, or any other file) is still reported.
# Requires gitleaks >= 8.25 ([[allowlists]] with targetRules / condition). CI runs 8.30.1.
[extend]
useDefault = true

# 1. Local gitignored secret files (never committed; a committed one fails the CI job's history step instead).
[[allowlists]]
description = "Local gitignored secret files (never committed): .env / .env.local / .env.* / secrets.local.*"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.env\.[^/]+$''',
  '''(^|/)secrets\.local\.[^/]+$''',
]

# 2. Synthetic DeepMap project keys in test gates: 12 or 16 lowercase hex, or "k" + 11 hex.
[[allowlists]]
description = "Synthetic project keys in tests/*_gates.py (sha1/sha256 hex prefixes, not credentials)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)tests/[A-Za-z0-9_]+_gates\.py$''',
]
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{12}$''',
  '''^k[0-9a-f]{11}$''',
  '''^[0-9a-f]{16}$''',
]

# 3. 40-hex constants in two named gates: a synthetic KEY and public upstream commit SHAs (benchmark corpora pins).
[[allowlists]]
description = "40-hex synthetic key / public git commit pins in two named gates"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)tests/provision_r7_gates\.py$''',
  '''(^|/)tests/typed_calls_engine_parity_gates\.py$''',
]
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{40}$''',
]

# 4. A graphify node id in one captured engine fixture.
[[allowlists]]
description = "graphify node id in a captured extraction fixture"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''(^|/)tests/fixtures/graphify_r7/extraction_r7\.json$''',
]
regexTarget = "secret"
regexes = [
  '''^pkg2_matcher$''',
]
