version: 2
updates:
  # Python runtime dependencies (requirements.txt). neo4j / mcp / graphifyy are pinned to VALIDATED ranges (both
  # ends measured) and anyio to a floor (mcp's own); the other names are unpinned. Both installers and the license
  # artifacts (NOTICE, THIRD-PARTY-LICENSES.md, sbom.cdx.json) repeat those specs, CI the three ranges, and
  # tests/compliance_gates.py fails when requirements.txt drifts from them — so a Dependabot PR that moves one stays
  # RED until every source moves with it. Widen a range only after the gate suite passes on the new release (see
  # requirements.txt). Dependabot surfaces upstream security + version updates as PRs. Keep the batch small and
  # reviewable.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # One grouped PR for the ML stack so torch/transformers/sentence-transformers move together.
      ml-stack:
        patterns:
          - torch
          - transformers
          - sentence-transformers
          - huggingface_hub

  # GitHub Actions used by the CI workflow(s) — keep the pinned action versions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
