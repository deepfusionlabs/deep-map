name: dependency-review

# On a pull request, checks the dependencies it adds or changes (requirements.txt and the actions the workflows use)
# against the GitHub Advisory Database, and fails when one of them has a known vulnerability of high or critical
# severity. The action needs the dependency graph, which a public repository has by default; a private repository
# needs GitHub Advanced Security for it, so the job runs only on a public repository and is skipped on a private one.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
